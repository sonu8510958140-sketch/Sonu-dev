<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Your Cart | Trendora</title>
</head>
<body class="min-h-screen bg-slate-50 text-black">
    <header class="flex items-center justify-between bg-black px-4 py-3">
        <a href="/" class="p-2 text-3xl font-bold text-white">Trendora</a>
        <nav aria-label="Main navigation">
            <a href="index.html" class="rounded-xl px-3 py-2 text-white transition-colors hover:bg-white hover:text-black">Continue shopping</a>
        </nav>
    </header>
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
        <h1 class="mb-6 text-3xl font-bold sm:text-4xl">Your Cart</h1>
        <p id="cart-status" class="mb-4 text-sm text-slate-600" role="status" aria-live="polite"></p>
        <p id="cart-error" class="hidden mb-4 rounded-xl bg-red-100 p-4 text-red-800" role="alert">Your cart could not be loaded. Please refresh the page and try again.</p>
        <div id="cart-items" class="space-y-4"></div>
        <section id="cart-summary" class="mt-8 hidden rounded-2xl bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between text-lg font-bold">
                <h2>Total</h2>
                <p id="cart-total">Rs 0</p>
            </div>
            <a href="/payment" class="mt-5 inline-block rounded-xl bg-black px-5 py-3 font-bold text-white transition-colors hover:bg-slate-800">Proceed to checkout</a>
        </section>
        <section id="empty-cart" class="rounded-2xl bg-white px-5 py-12 text-center shadow-sm">
            <h2 class="text-xl font-bold">Your cart is empty</h2>
            <p class="mt-2 text-slate-600">Browse the collections to find something you like.</p>
            <a href="index.html" class="mt-5 inline-block rounded-xl bg-black px-5 py-3 font-bold text-white transition-colors hover:bg-slate-800">Continue shopping</a>
        </section>
    </main>
    <script src="Script.js" defer></script>
</body>
</html>
