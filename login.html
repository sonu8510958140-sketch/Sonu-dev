<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Log in | Trendora</title>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
    <main class="w-full max-w-md rounded-2xl bg-white p-6 shadow-lg sm:p-10">
        <a href="/" class="block text-center font-serif text-3xl font-bold tracking-wide text-black">TRENDORA</a>
        <h1 class="mt-8 text-center text-3xl font-bold">Welcome back</h1>
        <p class="mt-2 text-center text-slate-500">Log in to your account to continue.</p>
        <p id="auth-message" role="alert" class="mt-4 hidden rounded-xl bg-red-100 px-4 py-3 text-sm text-red-800"></p>

        <form action="/login" method="post" class="mt-8 space-y-5">
            <div>
                <label for="email" class="mb-2 block text-sm font-semibold">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
            </div>
            <div>
                <div class="mb-2 flex items-center justify-between gap-2">
                    <label for="password" class="text-sm font-semibold">Password</label>
                    <a href="/forgot-password" class="text-sm font-medium text-sky-700 hover:underline">Forgot password?</a>
                </div>
                <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
            </div>
            <button type="submit" class="w-full rounded-xl bg-black px-4 py-3 font-bold text-white transition-colors hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black" id="log">Log in</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">New to Trendora? <a href="signup.html" class="font-semibold text-sky-700 hover:underline">Create an account</a></p>
    </main>
    <script src="/auth.js" defer></script>
</body>
</html>
