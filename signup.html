<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Create account | Trendora</title>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10 text-slate-900">
    <main class="w-full max-w-md rounded-2xl bg-white p-6 shadow-lg sm:p-10">
        <a href="/" class="block text-center font-serif text-3xl font-bold tracking-wide text-black" aria-label="Trendora home">TRENDORA</a>
        <h1 class="mt-8 text-center text-3xl font-bold">Create your account</h1>
        <p class="mt-2 text-center text-slate-500">Sign up to start exploring the latest styles.</p>
        <p id="auth-message" role="alert" class="mt-4 hidden rounded-xl bg-red-100 px-4 py-3 text-sm text-red-800"></p>

        <form action="/signup" method="post" class="mt-8 space-y-5">
            <div>
                <label for="email" class="mb-2 block text-sm font-semibold">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
            </div>
            <div>
                <label for="password" class="mb-2 block text-sm font-semibold">Password</label>
                <div class="flex gap-2">
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required aria-describedby="password-help" class="min-w-0 flex-1 rounded-xl border border-slate-300 px-4 py-3 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
                    <button type="button" data-toggle-password="password" aria-controls="password" aria-pressed="false" class="rounded-xl border border-slate-300 px-3 text-sm font-semibold hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">Show</button>
                </div>
                <p id="password-help" class="mt-2 text-sm text-slate-500">Use a unique password with at least 12 characters.</p>
            </div>
            <div>
                <label for="confirm-password" class="mb-2 block text-sm font-semibold">Confirm password</label>
                <div class="flex gap-2">
                    <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required aria-describedby="confirm-password-help" class="min-w-0 flex-1 rounded-xl border border-slate-300 px-4 py-3 text-base focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
                    <button type="button" data-toggle-password="confirm-password" aria-controls="confirm-password" aria-pressed="false" class="rounded-xl border border-slate-300 px-3 text-sm font-semibold hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">Show</button>
                </div>
                <p id="confirm-password-help" class="mt-2 text-sm text-slate-500">Re-enter your password exactly as above.</p>
            </div>
            <button type="submit" class="w-full rounded-xl bg-black px-4 py-3 font-bold text-white transition-colors hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">Create account</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">Already have an account? <a href="/login" class="font-semibold text-sky-700 hover:underline">Log in</a></p>
    </main>
    <script src="auth.js" defer></script>
</body>
</html>
