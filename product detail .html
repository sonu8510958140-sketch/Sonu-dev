<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Product details | Trendora</title>
</head>
<body class="min-h-screen bg-slate-50 text-black">
    <header class="flex flex-col items-center justify-between gap-2 bg-black px-4 py-3 sm:flex-row">
        <a href="/" class="p-2 text-3xl font-bold text-white">Trendora</a>
        <nav aria-label="Main navigation" class="flex flex-wrap justify-center gap-1 text-base text-white sm:gap-3">
            <a href="/" class="rounded-xl px-3 py-2 transition-colors hover:bg-white hover:text-black">Home</a>
            <a href="/men" class="rounded-xl px-3 py-2 transition-colors hover:bg-white hover:text-black">Men</a>
            <a href="/women" class="rounded-xl px-3 py-2 transition-colors hover:bg-white hover:text-black">Women</a>
            <a href="/kid" class="rounded-xl px-3 py-2 transition-colors hover:bg-white hover:text-black">Kids</a>
            <a href="/cart" class="rounded-xl px-3 py-2 transition-colors hover:bg-white hover:text-black">Cart (<span data-cart-count>0</span>)</a>
        </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
        <a id="back-to-collection" href="/men" class="mb-6 inline-block font-semibold text-sky-800 hover:underline">&larr; Back to collection</a>
        <p id="product-error" class="hidden rounded-xl bg-red-100 p-5 text-red-800" role="alert">This product link is incomplete or invalid. Please return to a collection and choose a product.</p>
        <article id="product-detail" data-product-card class="grid gap-8 rounded-2xl bg-white p-5 shadow-sm sm:p-8 md:grid-cols-2 md:items-center">
            <div class="overflow-hidden rounded-xl bg-slate-100">
                <img id="product-image" alt="" class="aspect-square h-full w-full object-contain">
            </div>
            <div class="flex flex-col">
                <p id="product-category" class="text-sm font-bold uppercase tracking-[0.2em] text-sky-700"></p>
                <h1 id="product-name" class="mt-3 text-3xl font-bold sm:text-4xl"></h1>
                <p id="product-price" class="mt-5 text-2xl font-bold"></p>
                <p class="mt-3 text-sm font-medium text-green-700">In stock</p>
                <p id="product-description" class="mt-5 leading-relaxed text-slate-600"></p>
                <div class="mt-8 flex flex-wrap gap-3">
                    <button type="button" data-add-to-cart class="rounded-xl bg-black px-6 py-3 font-bold text-white transition-colors hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">Add to Cart</button>
                    <a href="/cart" class="rounded-xl border border-slate-300 px-6 py-3 font-bold transition-colors hover:bg-slate-100">View Cart</a>
                </div>
                <p id="cart-status" class="mt-4 text-sm text-slate-600" role="status" aria-live="polite"></p>
                <p id="cart-error" class="hidden mt-4 rounded-xl bg-red-100 p-3 text-red-800" role="alert">Your cart could not be loaded. Please refresh the page and try again.</p>
            </div>
        </article>
    </main>
    <script src="Script.js" defer></script>
</body>
</html>
